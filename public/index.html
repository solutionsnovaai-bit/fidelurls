<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<title>Fidel URLs</title>
<link rel="icon" href="/_fidel/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/_fidel/apple-touch-icon.png">
<link rel="manifest" href="/_fidel/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Fidel URLs">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Michroma&family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/_fidel/style.css">
</head>
<body class="booting">
<div id="loader" aria-hidden="true">
  <svg class="ld-globe" viewBox="-60 -60 120 120">
    <defs>
      <linearGradient id="ldc" x1="0" y1="0" x2="0.3" y2="1">
        <stop offset="0" stop-color="#fff"/><stop offset="0.3" stop-color="#cfd2d7"/><stop offset="0.5" stop-color="#5e6167"/>
        <stop offset="0.56" stop-color="#34363b"/><stop offset="0.74" stop-color="#e2e4e7"/><stop offset="1" stop-color="#8b8e94"/>
      </linearGradient>
      <radialGradient id="ldb" cx="0.38" cy="0.32" r="0.75"><stop offset="0" stop-color="#232428"/><stop offset="1" stop-color="#000"/></radialGradient>
    </defs>
    <ellipse class="ld-ring back" rx="55" ry="13" transform="rotate(-18)"/>
    <circle r="34" fill="url(#ldb)"/>
    <g class="ld-grid">
      <ellipse class="m" rx="34" ry="34"/><ellipse class="m" rx="34" ry="34"/><ellipse class="m" rx="34" ry="34"/>
      <ellipse class="m" rx="34" ry="34"/><ellipse class="m" rx="34" ry="34"/><ellipse class="m" rx="34" ry="34"/>
      <path d="M-34 0H34M-29.4 -17H29.4M-29.4 17H29.4"/>
    </g>
    <circle r="34" class="ld-edge"/>
    <path class="ld-ring" d="M-52.3 17A55 13 -18 0 0 52.3 -17" />
    <circle r="2.2" fill="#fff" class="ld-sat"><animateMotion dur="2.4s" repeatCount="indefinite" path="M52.3 -17A55 13 -18 1 1 -52.3 17A55 13 -18 1 1 52.3 -17"/></circle>
  </svg>
  <div class="ld-mark"><b>Fidel</b><span>URLs</span></div>
</div>
<script>
  // Mostra o nome salvo já na tela de carregamento, sem esperar o painel abrir.
  try {
    var n = localStorage.getItem('fidel_name');
    if (n && n !== 'Fidel URLs') {
      n = n.replace(/[<>&]/g, '').slice(0, 40);
      document.querySelector('.ld-mark').innerHTML = '<b></b>';
      document.querySelector('.ld-mark b').textContent = n;
      document.title = n;
    }
  } catch (e) {}
</script>
<div id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>
<noscript><p style="padding:24px;color:#fff;font-family:sans-serif">Ative o JavaScript para usar o Fidel URLs.</p></noscript>
<script type="module" src="/_fidel/app.js"></script>
</body>
</html>
